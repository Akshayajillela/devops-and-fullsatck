<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Function Example</title>
</head>
<body>

    <h2>JavaScript Function Demo</h2>
    <button onclick="sayHello()">Click Me</button>
    <p id="output"></p>

    <script>
        // Function definition
        function sayHello() {
            document.getElementById("output").innerHTML =
                "Hello! This is a JavaScript function.";
        }
    </script>

</body>
</html>
